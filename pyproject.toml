[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starlife-eval"
version = "0.1.0"
description = "StarLife-1-WSV observation-model evaluation harness (real metrics, no mock data)"
requires-python = "==3.11.*"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# 本地头推理需要 torch；云端回放/指标计算只需要 numpy
torch = ["torch>=2.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
